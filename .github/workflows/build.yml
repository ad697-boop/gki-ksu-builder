name: Build KernelSU GKI kernel (android12-5.10 @ g992742f9cdcc)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Free disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 unzip zip xz-utils cpio lz4 openssl bc bison flex libssl-dev libelf-dev ccache
          mkdir -p "$HOME/bin"
          curl -sS https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          repo --version

      - name: Sync kernel source (android12-5.10, 2025-12 release)
        run: |
          set -e
          if repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2025-12 --repo-rev=v2.16; then
            echo "Using pinned manifest: common-android12-5.10-2025-12"
          else
            echo "Pinned manifest not found, using rolling branch common-android12-5.10"
            repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --repo-rev=v2.16
          fi
          repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Pin kernel commit (exact if reachable, else official 2025-12 release)
        run: |
          cd common
          echo "Manifest revision HEAD: $(git rev-parse HEAD)"
          if ! git cat-file -e g992742f9cdcc^{commit} 2>/dev/null; then
            echo "Exact ROM commit not in tree; best-effort fetch (time-based)..."
            git fetch --shallow-since=2025-10-01 https://android.googlesource.com/kernel/common android12-5.10 2>&1 | tail -n 2 || true
            if git cat-file -e g992742f9cdcc^{commit} 2>/dev/null; then
              git checkout g992742f9cdcc
              echo "Pinned to exact ROM commit g992742f9cdcc"
            else
              echo "Exact commit NOT reachable; building official android12-5.10 2025-12 release (same KMI/SPL) instead"
            fi
          else
            git checkout g992742f9cdcc
            echo "Pinned to exact ROM commit g992742f9cdcc"
          fi
          echo "Build source HEAD: $(git rev-parse HEAD)"

      - name: Integrate KernelSU (built-in)
        run: |
          cd common
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          # Force the exact ROM kernel version string so vendor module vermagic matches
          sed -i 's/^SUBLEVEL.*/SUBLEVEL = 245/' Makefile
          echo 'CONFIG_LOCALVERSION="-gki-g992742f9cdcc"' >> arch/arm64/configs/gki_defconfig
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> arch/arm64/configs/gki_defconfig
          # Disable KMI symbol trimming so all exported symbols are kept (like the ROM kernel)
          echo '# CONFIG_TRIM_UNUSED_KSYMS is not set' >> arch/arm64/configs/gki_defconfig
          echo '# CONFIG_UNUSED_KSYMS is not set' >> arch/arm64/configs/gki_defconfig
          # Force setlocalversion to emit nothing (kills the dirty-tree "+" suffix)
          sed -i 's|echo "\$res"|echo ""|' scripts/setlocalversion
          grep -n "CONFIG_KSU\|CONFIG_LOCALVERSION\|CONFIG_TRIM_UNUSED_KSYMS" arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
          set -e
          # Keep the build as close to stock GKI as possible, but skip ABI strict checks
          sed -i 's/check_defconfig//' common/build.config.gki || true
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64 || true
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' common/build.config.gki.aarch64 || true
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64 || true
          # Match ROM kernel behavior: keep all exported symbols (no KMI trimming)
          for f in common/build.config.gki common/build.config.gki.aarch64 common/build.config.common; do
            if [ -f "$f" ]; then
              sed -i -e 's/^TRIM_NONLISTED_KMI=.*/TRIM_NONLISTED_KMI=0/' -e 's/^KMI_ENFORCED=.*/KMI_ENFORCED=0/' "$f"
            fi
          done
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          ls -la out/android12-5.10/dist/

      - name: Verify kernel version string
        run: |
          strings out/android12-5.10/dist/Image | grep -m1 "Linux version" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image-ksu-5.10.245
          path: |
            out/android12-5.10/dist/Image
            out/android12-5.10/dist/Image.lz4
            out/android12-5.10/dist/Image.gz
            out/android12-5.10/dist/boot.img
