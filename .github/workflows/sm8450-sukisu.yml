name: Build SukiSU kernel (SM8450 lineage-23.2 / cupid)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'ROM 包直链（从里面提取原厂 boot.img）'
        required: false
        default: 'https://mirror.math.princeton.edu/pub/lineageos/full/cupid/20260820/lineage-23.2-20260820-nightly-cupid-signed.zip'
      kernel_commit:
        description: '内核源码 commit（LineageOS/android_kernel_xiaomi_sm8450 lineage-23.2）'
        required: false
        default: 'e682ed2de56fd2841ef35741c4d0f03599ffd561'
      ksu_ref:
        description: 'SukiSU-Ultra 分支/tag（kprobe 方案用 main，稳定版用 v4.1.3）'
        required: false
        default: 'v4.1.3'
      ksu_version:
        description: '强制内核驱动版本号（与管理器一致用 40796；留空则自动）'
        required: false
        default: '40796'
      build_rekernel_x:
        description: '同时编译 ReKernel-X LKM 并打包成模块（墓碑模块内核支持）'
        required: false
        default: 'yes'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ROM_URL: ${{ inputs.rom_url }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      KSU_REF: ${{ inputs.ksu_ref }}
      KERNEL_REPO: LineageOS/android_kernel_xiaomi_sm8450
      KERNEL_BRANCH: lineage-23.2
      KSU_REPO: SukiSU-Ultra/SukiSU-Ultra
      KSU_VERSION: ${{ inputs.ksu_version }}
      BUILD_REKERNEL_X: ${{ inputs.build_rekernel_x }}
      CLANG_TAR: clang-r563880c.tar.gz
      CLANG_URL: https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r563880c.tar.gz
      MAGISK_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
      MAGISKBOOT_SHA256: a18ecbd7981179494b7d281453d6c4e25b5c719e7d2ef7f6eba3c6be3043c58e
      PAYLOAD_DUMPER_URL: https://github.com/ssut/payload-dumper-go/releases/download/2.0.2/payload-dumper-go_2.0.2_linux_amd64.tar.gz

    steps:
      - name: Free disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget xz-utils zstd cpio lz4 pkg-config bc bison flex libssl-dev libelf-dev ccache zip unzip python3 file

      - name: Download clang toolchain (clang-r563880c, same as nightly build)
        run: |
          set -e
          mkdir -p "$HOME/toolchain"
          cd "$HOME/toolchain"
          curl -fL --retry 5 -o "$CLANG_TAR" "$CLANG_URL"
          tar -xf "$CLANG_TAR"
          rm -f "$CLANG_TAR"
          if [ -x bin/clang ]; then
            TC="$HOME/toolchain"
          else
            BIN_DIR=$(find "$HOME/toolchain" -type f -path '*/bin/clang' | head -1 | xargs dirname)
            TC=$(dirname "$BIN_DIR")
          fi
          echo "TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "$TC/bin" >> "$GITHUB_PATH"
          clang --version | head -1

      - name: Download magiskboot (Linux, official Magisk APK)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -fL --retry 5 -o magisk.apk "$MAGISK_APK_URL"
          unzip -jo magisk.apk lib/x86_64/libmagiskboot.so -d . >/dev/null
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "$MAGISKBOOT_SHA256  magiskboot" | sha256sum -c -
          file magiskboot
          strings magiskboot | grep -m1 'MagiskBoot'

      - name: Download payload-dumper-go (Linux)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -fL --retry 5 -o pdg.tar.gz "$PAYLOAD_DUMPER_URL"
          mkdir -p pdg
          tar -xf pdg.tar.gz -C pdg
          PAYLOAD_BIN=$(find pdg -maxdepth 2 -type f -name 'payload-dumper*' | head -1)
          chmod +x "$PAYLOAD_BIN"
          file "$PAYLOAD_BIN"
          echo "PAYLOAD_BIN=$PAYLOAD_BIN" >> "$GITHUB_ENV"

      - name: Download ROM zip
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -fL --retry 5 -o rom.zip "$ROM_URL"
          ls -lh rom.zip

      - name: Extract boot.img from ROM payload
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          "$PAYLOAD_BIN" -partitions boot -o rom_out rom.zip
          ls -lh rom_out/

      - name: Clone kernel source (LineageOS SM8450 @ pinned commit)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout "$KERNEL_COMMIT"
          echo "Kernel source HEAD: $(git rev-parse HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) = ' Makefile

      - name: Unpack stock boot.img
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p boot_work
          cd boot_work
          # magiskboot 遇到 vbmeta 脚注的 ASN.1 警告时会返回 1，但内核/ramdisk 已正常解出，这里容忍该警告
          ../magiskboot unpack ../rom_out/boot.img 2>&1 | tee unpack.log || true
          # 原厂 boot.img 复制到工作目录，供后面 repack 使用
          cp ../rom_out/boot.img boot.img
          grep -q 'HEADER_VER' unpack.log || { cat unpack.log; exit 1; }
          test -s kernel
          test -s ramdisk.cpio
          ls -lh kernel ramdisk.cpio

      - name: Extract stock kernel version and exact kernel config
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          VERMAGIC=$(strings ../boot_work/kernel | grep -m1 'SMP preempt mod_unload modversions' || true)
          if [ -z "$VERMAGIC" ]; then
            echo "Failed to find vermagic in stock kernel"; exit 1
          fi
          STOCK_VER=$(echo "$VERMAGIC" | awk '{print $1}')
          echo "STOCK_VER=$STOCK_VER"
          echo "STOCK_VER=$STOCK_VER" >> "$GITHUB_ENV"
          KBASE=$(awk '/^VERSION/{v=$3} /^PATCHLEVEL/{p=$3} /^SUBLEVEL/{s=$3} END{print v"."p"."s}' Makefile)
          SUFFIX=${STOCK_VER#"$KBASE"}
          if [ -z "$SUFFIX" ]; then
            echo "Failed to compute version suffix (base=$KBASE ver=$STOCK_VER)"; exit 1
          fi
          echo "KBASE=$KBASE SUFFIX=$SUFFIX"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          bash scripts/extract-ikconfig ../boot_work/kernel > ../boot_work/stock.config
          wc -l ../boot_work/stock.config
          grep -E '^CONFIG_LOCALVERSION' ../boot_work/stock.config || true

      - name: Integrate SukiSU Ultra (${{ env.KSU_REF }})
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          git clone --branch "$KSU_REF" --single-branch "https://github.com/$KSU_REPO" KernelSU
          git -C KernelSU rev-parse --short=8 HEAD
          # SukiSU 的 KSU_VERSION 默认由 GitHub API 按 main 分支提交数实时计算（与 tag 无关），
          # 这里按输入强制写死，保证驱动版本 == 管理器版本（如 v4.1.3 -> 40796）
          if [ -n "$KSU_VERSION" ]; then
            sed -i "s/^KSU_VERSION[[:space:]]*:=.*$/KSU_VERSION := $KSU_VERSION/" KernelSU/kernel/Kbuild
            grep -E '^KSU_VERSION' KernelSU/kernel/Kbuild
          fi
          # builtin 分支在 5.10 上有一个已知类型 bug（USER_ARG_NULL 宏返回指针，但 capture 参数要结构体），做兼容修复；main 分支无此代码，sed 为空操作
          sed -i 's/#define USER_ARG_NULL user_arg_null_ptr()/#define USER_ARG_NULL (*user_arg_null_ptr())/' KernelSU/kernel/sulog/event.c || true
          ln -s ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || printf '\nmenu "KernelSU"\nsource "drivers/kernelsu/Kconfig"\nendmenu\n' >> drivers/Kconfig
          ls -l drivers/kernelsu/Kconfig
          tail -n 6 drivers/Kconfig

      - name: Prepare kernel config (stock config + KSU, exact version string)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/boot_work/stock.config" out/.config
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "$SUFFIX"
          scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --disable KSU_SUSFS
          # full LTO 在 2 核/7GB 的 runner 上会 OOM（exit 143），改用内存占用小得多的 thin LTO，不影响 vermagic/模块兼容
          scripts/config --file out/.config --disable LTO_CLANG_FULL
          scripts/config --file out/.config --enable LTO_CLANG_THIN
          grep -E 'CONFIG_LOCALVERSION|^CONFIG_KSU' out/.config || true
          export PATH="$TOOLCHAIN/bin:$PATH"
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O=out olddefconfig
          grep -E '^CONFIG_KSU=|^CONFIG_LOCALVERSION|^CONFIG_LOCALVERSION_AUTO|^CONFIG_LTO' out/.config

      - name: Add swap (avoid OOM during kernel build)
        run: |
          set -e
          # GitHub runner 自带一个正在使用的 /swapfile（fallocate 会报 Text file busy），先停用再重建一个更大的
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel (Image)
        run: |
          set -e -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          export PATH="$TOOLCHAIN/bin:$PATH"
          # 关键：AUTO=n 且内核在 git 仓库里时，setlocalversion 会在 --short 分支输出 "+"（脏树标记），
          # 导致 vermagic 变成 5.10.256-gki-ge682ed2de56f+，与原厂 vendor 模块（无 +）不匹配。
          # 设置空的 LOCALVERSION 环境变量即可抑制该 "+"。
          export LOCALVERSION=""
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O=out -j"$(nproc)" Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ls -lh out/arch/arm64/boot/Image

      - name: Build ReKernel-X LKM (matching this kernel)
        if: env.BUILD_REKERNEL_X == 'yes'
        run: |
          set -e -o pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/myflavor/ReKernel-X rekernel_x
          cd kernel
          # LKM 源码里的 #include "../android/binder_internal.h" 是相对路径，
          # 必须放在内核树 drivers/rekernel_x 下编译（官方 README 的要求）
          mkdir -p drivers/rekernel_x
          cp -r "$GITHUB_WORKSPACE/rekernel_x/LKM-Source/"* drivers/rekernel_x/
          export PATH="$TOOLCHAIN/bin:$PATH"
          export LOCALVERSION=""
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 O=out M="$GITHUB_WORKSPACE/kernel/drivers/rekernel_x" RKX_VERSION="v1.5" modules 2>&1 | tee "$GITHUB_WORKSPACE/lkm_build.log"
          ls -lh "$GITHUB_WORKSPACE/kernel/drivers/rekernel_x"/rekernel_x.ko
          MOD_VER=$(strings "$GITHUB_WORKSPACE/kernel/drivers/rekernel_x"/rekernel_x.ko | grep -m1 'SMP preempt mod_unload modversions' | awk '{print $1}')
          MOD_VER=${MOD_VER#vermagic=}
          echo "LKM vermagic: $MOD_VER"
          if [ "$MOD_VER" != "$STOCK_VER" ]; then
            echo "LKM VERMAGIC MISMATCH: $MOD_VER != $STOCK_VER"
            exit 1
          fi

      - name: Package ReKernel-X module zip
        if: env.BUILD_REKERNEL_X == 'yes'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -fL --retry 5 -o rekernel_x_official.zip "https://github.com/myflavor/ReKernel-X/releases/download/1.5/ReKernel-X-1.5.zip"
          mkdir -p module_tpl
          unzip -qo rekernel_x_official.zip -d module_tpl
          rm -rf module_tpl/kmod
          mkdir -p module_tpl/kmod
          cp "$GITHUB_WORKSPACE/kernel/drivers/rekernel_x/rekernel_x.ko" "module_tpl/kmod/rekernel_x-android12-5.10-20260823.ko"
          sed -i 's/^version=.*/version=1.5-cupid/' module_tpl/module.prop
          sed -i 's/^versionCode=.*/versionCode=7/' module_tpl/module.prop
          (cd module_tpl && zip -qr "$GITHUB_WORKSPACE/ReKernel-X-1.5-cupid-5.10.256.zip" .)
          ls -lh "$GITHUB_WORKSPACE/ReKernel-X-1.5-cupid-5.10.256.zip"

      - name: Upload build log (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log

      - name: Verify kernel version and config
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          echo "=== built Linux version ==="
          strings out/arch/arm64/boot/Image | grep -m1 'Linux version' || true
          BUILT_VER=$(strings out/arch/arm64/boot/Image | grep -m1 'SMP preempt mod_unload modversions' | awk '{print $1}')
          echo "BUILT_VER=$BUILT_VER"
          if [ "$BUILT_VER" != "$STOCK_VER" ]; then
            echo "VERSION MISMATCH: built=$BUILT_VER stock=$STOCK_VER"
            exit 1
          fi
          bash scripts/extract-ikconfig out/arch/arm64/boot/Image > out/built.config
          grep -E '^CONFIG_KSU=' out/built.config
          echo "=== config diff vs stock (non-fatal, filtered) ==="
          diff -u "$GITHUB_WORKSPACE/boot_work/stock.config" out/built.config \
            | grep -E '^[+-](CONFIG_|# CONFIG_)' \
            | grep -viE 'KSU|LOCALVERSION|IKCONFIG|CC_VERSION|GCC_VERSION|TRIM_UNUSED|MODULE_SCMVERSION' \
            | head -60 || true

      - name: Repack boot.img with KSU kernel
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/boot_work"
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" kernel
          ../magiskboot repack boot.img 2>&1 | tee repack.log || true
          if [ ! -s new-boot.img ]; then
            echo "===== repack failed, log: ====="
            cat repack.log
            exit 1
          fi
          ls -lh new-boot.img
          cp new-boot.img "boot-sukiSU-$STOCK_VER.img"
          # verify the repacked image contains our kernel
          rm -f kernel ramdisk.cpio
          ../magiskboot unpack "boot-sukiSU-$STOCK_VER.img" 2>&1 | tee repack_verify.log || true
          grep -q 'HEADER_VER' repack_verify.log || { cat repack_verify.log; exit 1; }
          strings kernel | grep -m1 "$STOCK_VER"
          strings kernel | grep -m1 'KernelSU' || true

      - name: Summary
        run: |
          echo "=================================================="
          echo "构建完成：boot-sukiSU-$STOCK_VER.img"
          echo ""
          echo "刷入方法（先备份原 boot）:"
          echo "  fastboot flash boot boot-sukiSU-$STOCK_VER.img"
          echo "  fastboot reboot"
          echo ""
          echo "备用：内核原始 Image 也在产物里，可用 magiskboot 自行换入其它 ROM 的 boot.img"
          echo "=================================================="

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-sukiSU-${{ env.STOCK_VER }}
          path: |
            ${{ github.workspace }}/boot_work/boot-sukiSU-${{ env.STOCK_VER }}.img
            ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image
            ${{ github.workspace }}/rom_out/boot.img
            ${{ github.workspace }}/boot_work/stock.config
            ${{ github.workspace }}/kernel/out/built.config
            ${{ github.workspace }}/ReKernel-X-1.5-cupid-5.10.256.zip
            ${{ github.workspace }}/kernel/drivers/rekernel_x/rekernel_x.ko
